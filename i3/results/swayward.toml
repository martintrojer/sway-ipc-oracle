# Curated result of an unchanged upstream i3 test-suite run.
# Counts use the first unindented TAP plan and first TAP stream.
# pass, skip, fail, and unreached together cover each emitted plan.

[run]
compositor = "swayward"
version = "swayward 26.04 (v26.04-123-gb420c1a4)"
commit = "b420c1a4316af8ed55c83d73fbad93d66f4d8530"
i3_suite_commit = "9be3249ac5b377ed3270e36bca83df53d8023337"
environment = "headless compositor with private IPC/X11 sockets and real X11 clients"

[families]
headless_xtest_boundary = "The headless harness cannot deliver XTEST events from Xwayland to a Wayland compositor, so assertions that depend on those events are not measured."
xwayland_satellite_kill_disconnects_client = "Swayward sends xdg_toplevel.close when its kill command closes an Xwayland surface. xwayland-satellite handles that event by sending X KillClient when WM_DELETE_WINDOW is absent; i3 instead destroys only the selected window for its default kill mode. i3test creates every test window on one connection without WM_PROTOCOLS, so later assertions cannot run after the first kill."

