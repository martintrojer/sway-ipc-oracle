# Scenario recipes are compositor-neutral sway/i3 commands. `window:ID` opens a
# standalone client; `capture:NAME` records tree, workspaces, and outputs.
# Add scenarios by appending a table. The runner resets state before each table.

[[scenario]]
name = "empty"
actions = ["capture:empty"]

[[scenario]]
name = "one_window"
actions = ["window:fixture-1", "capture:one_window"]

[[scenario]]
name = "two_split_h"
actions = ["command:splith", "window:fixture-1", "window:fixture-2", "capture:two_split_h"]

[[scenario]]
name = "two_split_v"
actions = ["command:splitv", "window:fixture-1", "window:fixture-2", "capture:two_split_v"]

[[scenario]]
name = "nested_h_in_v"
actions = ["window:fixture-1", "command:splitv", "window:fixture-2", "command:splith", "window:fixture-3", "capture:nested_h_in_v"]

[[scenario]]
name = "tabbed"
actions = ["command:layout tabbed", "window:fixture-1", "window:fixture-2", "capture:tabbed"]

[[scenario]]
name = "stacked"
actions = ["command:layout stacking", "window:fixture-1", "window:fixture-2", "capture:stacked"]

[[scenario]]
name = "one_floating"
actions = ["window:fixture-1", "window:fixture-2", "command:floating enable", "capture:one_floating"]

[[scenario]]
name = "two_floating"
actions = ["window:fixture-1", "command:floating enable", "window:fixture-2", "command:floating enable", "capture:two_floating"]

[[scenario]]
name = "three_floating_raise"
actions = ["window:fixture-tiled", "window:fixture-1", "command:floating enable", "window:fixture-2", "command:floating enable", "window:fixture-3", "command:floating enable", "capture:three_floating_before_raise", "command:[app_id=\"^fixture-1$\"] focus", "capture:three_floating_after_raise"]

[[scenario]]
name = "fullscreen"
actions = ["window:fixture-1", "command:fullscreen enable", "capture:fullscreen"]

[[scenario]]
name = "marked"
actions = ["window:fixture-1", "command:mark testmark", "capture:marked"]

[[scenario]]
name = "two_workspaces"
actions = ["window:fixture-1", "command:workspace 2", "window:fixture-2", "capture:two_workspaces"]

[[scenario]]
name = "numbered_sparse"
actions = ["window:fixture-1", "command:workspace 3", "window:fixture-3", "command:workspace 7", "window:fixture-7", "capture:numbered_sparse"]

[[scenario]]
name = "named_workspace"
actions = ["command:workspace mail", "window:fixture-mail", "capture:named_workspace"]

[[scenario]]
name = "empty_named"
actions = ["command:workspace mail", "capture:empty_named"]

[[scenario]]
name = "two_outputs"
outputs = 2
actions = ["window:fixture-1", "command:move workspace to output right", "command:workspace 2", "window:fixture-2", "command:focus output left", "capture:two_outputs"]

[[scenario]]
name = "scratchpad"
actions = ["window:fixture-1", "command:move scratchpad", "capture:scratchpad_hidden", "command:scratchpad show", "capture:scratchpad_shown"]

[[scenario]]
name = "sticky"
actions = ["window:fixture-1", "command:floating enable", "command:sticky enable", "command:workspace 2", "capture:sticky_workspace_switch"]

[[scenario]]
name = "nested_tabbed_in_stacked"
actions = ["command:splith", "window:fixture-1", "window:fixture-2", "command:focus parent", "command:layout stacking", "command:[app_id=\"^fixture-1$\"] focus", "command:splith", "window:fixture-3", "command:focus parent", "command:layout tabbed", "command:[app_id=\"^fixture-1$\"] focus", "capture:nested_tabbed_in_stacked"]

[[scenario]]
name = "nested_stacked_in_tabbed"
actions = ["command:splith", "window:fixture-1", "window:fixture-2", "command:focus parent", "command:layout tabbed", "command:[app_id=\"^fixture-1$\"] focus", "command:splith", "window:fixture-3", "command:focus parent", "command:layout stacking", "command:[app_id=\"^fixture-1$\"] focus", "capture:nested_stacked_in_tabbed"]

[[scenario]]
name = "borders_and_gaps"
actions = ["command:gaps inner all set 17", "command:gaps outer all set 23", "window:fixture-normal", "command:border normal 4", "window:fixture-pixel", "command:border pixel 6", "window:fixture-none", "command:border none", "capture:borders_and_gaps"]

[[scenario]]
name = "urgent_via_command"
requires = ["sway-command-language"]
not_applicable = true
reason = "i3 has no urgent command; source: i3/src/commands.c command table. This covers compositor-originated urgency via IPC; client-originated urgency is not covered."
actions = ["window:fixture-1", "command:workspace 2", "command:[app_id=\"^fixture-1$\"] urgent enable", "capture:urgent_via_command"]

[[scenario]]
name = "markup_title"
actions = ["window_title:fixture-markup|<b>bold literal</b>", "capture:markup_title"]

[[scenario]]
name = "fullscreen_workspace"
actions = ["window:fixture-1", "command:fullscreen enable", "capture:fullscreen_workspace"]

[[scenario]]
name = "fullscreen_global"
actions = ["window:fixture-1", "command:fullscreen enable global", "capture:fullscreen_global"]

[[scenario]]
name = "container_mark"
actions = ["window:fixture-1", "command:splitv", "window:fixture-2", "command:splith", "window:fixture-3", "command:focus parent", "command:mark containermark", "capture:container_mark"]

[[scenario]]
name = "disabled_output_evacuation"
outputs = 2
requires = ["sway-command-language"]
not_applicable = true
reason = "i3 has no output command; source: i3/src/commands.c command table. Output disable is a sway extension; source: sway/sway/commands/output/disable.c."
actions = ["window:fixture-1", "command:move workspace to output right", "command:output HEADLESS-2 disable", "capture:disabled_output_evacuation"]

[[scenario]]
name = "differential_seed_0"
actions = ["window:fixture-diff-1", "capture:differential_seed_0"]

[[scenario]]
name = "command_coverage"
requires = ["sway-command-language"]
reason = "i3 lacks sway's allow_tearing, inhibit_idle, max_render_time, opacity, shortcuts_inhibitor, title_format, and explicit swap syntax."
actions = ["window:fixture-command-1", "command:mark commandmark", "window:fixture-command-2", "command:allow_tearing enable", "command:inhibit_idle focus", "command:max_render_time 1", "command:opacity 0.9", "step:resize grow width 10 px", "command:shortcuts_inhibitor enable", "command:title_format command-title", "command:swap container with mark commandmark", "command:unmark commandmark", "command:rename workspace 1 to command-workspace", "command:[app_id=\"^fixture-command-2$\"] kill", "capture:command_coverage"]
